[project]
name = "ransomware-ml-detection"
version = "0.1.0"
description = "Ransomware detection from MLRan sandbox behaviour"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
# Not an installable package: run modules from the repo root (python -m src.<module>).
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Outline scripts keep their original one-line description comments.
"src/*.py" = ["E501"]
